[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-reliability-benchmarks"
version = "0.1.0"
description = "Benchmark runner and asset preparation scripts for evaluating LLM reliability."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "accelerate",
  "datasets",
  "huggingface_hub",
  "numpy",
  "pandas",
  "requests",
  "torch",
  "tqdm",
  "transformers",
]

[project.optional-dependencies]
gpu = ["bitsandbytes>=0.43"]
dev = ["pytest>=8", "ruff>=0.8"]
plots = ["matplotlib>=3.8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
